---
- name: Harden SSH, configure firewall, and create users
  hosts: localhost         # Строго localhost вместо all
  connection: local
  become: true
  gather_facts: false      # Явный setup в pre_tasks чтобы контролировать порядок

  vars:
    ssh_port: 22
    ansible_managed: "Ansible managed: {file} modified on %Y-%m-%d"

  pre_tasks:
    - name: "Сбор фактов"
      ansible.builtin.setup:

    # 2. Теперь включаем become только для вывода логотипа и логов, если нужно (или оставляем false)
    - name: "======================================================"
      ansible.builtin.debug:
        msg:
          - "  SSSS  H   H       FFFFF  III  RRRR   EEEE W   W  AAAAA  L      L      "
          - "  S     H   H       F       I   R   R  E    W   W  A   A  L      L      "
          - "  SSSS  HHHHH       FFFF    I   RRRR   EEE  W W W  AAAAA  L      L      "
          - "      S H   H       F       I   R  R   E    W W W  A   A  L      L      "
          - "  SSSS  H   H       F      III  R   R  Eeee  W W  A   A  LLLLL  LLLLL  "
          - ""
          - "  🛡️  Применение конфигурации безопасности сервера"
          - "  ═══════════════════════════════════════════════"
      tags: always

    - name: "Сбор фактов о системе"
      ansible.builtin.debug:
        msg:
          - "ОС: {{ ansible_distribution }} {{ ansible_distribution_version }} ({{ ansible_os_family }})"
          - "Ядро: {{ ansible_kernel }}"
          - "Архитектура: {{ ansible_architecture }}"
          - "Хостнейм: {{ ansible_hostname }}"
      tags: always

  roles:
    - ssh-hardening
    - firewall
    - users

  post_tasks:
    - name: "======================================================"
      ansible.builtin.debug:
        msg:
          - "  ✅  ПЛЕЙБУК УСПЕШНО ЗАВЕРШЁН  ✅"
      tags: always