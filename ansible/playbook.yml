---
- name: Harden SSH, configure firewall, and create users
  hosts: all
  become: true
  gather_facts: true

  vars:
    ssh_port: 22
    ansible_managed: "Ansible managed: {file} modified on %Y-%m-%d"

  pre_tasks:
    - name: "======================================================"
      ansible.builtin.debug:
        msg:
          - "  SSSS  H   H       FFFFF  III  RRRR   EEEE W   W  AAAAA  L      L      "
          - "  S     H   H       F       I   R   R  E    W   W  A   A  L      L      "
          - "  SSSS  HHHHH       FFFF    I   RRRR   EEE  W W W  AAAAA  L      L      "
          - "      S H   H       F       I   R  R   E    W W W  A   A  L      L      "
          - "  SSSS  H   H       F      III  R   R  EEEE  W W  A   A  LLLLL  LLLLL  "
          - ""
          - "  🛡️  Применение конфигурации безопасности сервера"
          - "  ═══════════════════════════════════════════════"
          - ""
          - "  Роли:"
          - "    1. ssh-hardening — отключение паролей, запрет root, ключи"
          - "    2. firewall      — ufw с Zero Trust (запрещено всё, кроме SSH)"
          - "    3. users         — создание admin-user (sudo) и deploy-user"
          - ""
          - "  Целевой хост: {{ inventory_hostname }}"
          - "  SSH порт:      {{ ssh_port }}"
      tags: always

    - name: "Сбор фактов о системе"
      ansible.builtin.debug:
        msg:
          - "ОС: {{ ansible_distribution }} {{ ansible_distribution_version }} ({{ ansible_os_family }})"
          - "Ядро: {{ ansible_kernel }}"
          - "Архитектура: {{ ansible_architecture }}"
          - "Хостнейм: {{ ansible_hostname }}"
      tags: always

  roles:
    - ssh-hardening
    - firewall
    - users

  post_tasks:
    - name: "======================================================"
      ansible.builtin.debug:
        msg:
          - "  ✅  ПЛЕЙБУК УСПЕШНО ЗАВЕРШЁН  ✅"
          - ""
          - "  Итог:"
          - "  • SSH: парольный вход отключён, root запрещён, только ключи"
          - "  • Фаервол: ufw активен, Zero Trust (закрыто всё, кроме SSH)"
          - "  • Пользователи: admin-user (sudo), deploy-user созданы"
          - ""
          - "  ⚠  НЕ ЗАКРЫВАЙТЕ ТЕКУЩУЮ SSH-СЕССИЮ, пока не проверите:"
          - "     ssh -i roles/users/files/admin-key admin-user@localhost"
          - ""
          - "  Если что-то пошло не так — исправьте и запустите плейбук снова."
      tags: always