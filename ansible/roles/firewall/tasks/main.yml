---
- name: "[FIREWALL] ====== НАЧАЛО: Роль firewall ======"
  ansible.builtin.debug:
    msg:
      - "Цель: реализовать Zero Trust — запрещено всё, что не разрешено явно"
      - "Используется ufw (Uncomplicated Firewall) через ansible.builtin.command"
      - "Стратегия: default deny incoming, default allow outgoing, открыть SSH + HTTP/HTTPS"
  tags: firewall

- name: "[FIREWALL] Установка пакета ufw"
  ansible.builtin.debug:
    msg: "Выполняется apt install ufw — утилита для управления nftables в Ubuntu"
  tags: firewall

- name: Ensure ufw is installed
  ansible.builtin.apt:
    name: ufw
    state: present
  tags: firewall

- name: "[FIREWALL] Установка политик по умолчанию"
  ansible.builtin.debug:
    msg:
      - "Входящие: DENY — все входящие соединения запрещены по умолчанию (Zero Trust)"
      - "Исходящие: ALLOW — исходящие соединения разрешены (обновления, DNS и т.д.)"
  tags: firewall

- name: ufw default deny incoming
  ansible.builtin.command: ufw default deny incoming
  changed_when: false
  tags: firewall

- name: ufw default allow outgoing
  ansible.builtin.command: ufw default allow outgoing
  changed_when: false
  tags: firewall

- name: "[FIREWALL] Открытие порта SSH"
  ansible.builtin.debug:
    msg: "Разрешаем входящие TCP-соединения на порт {{ ssh_port | default(22) }}"
  tags: firewall

- name: ufw allow SSH on configured port
  ansible.builtin.command: "ufw allow {{ ssh_port | default(22) }}/tcp"
  changed_when: false
  tags: firewall

- name: "[FIREWALL] Открытие портов веб-сервера (80, 443)"
  ansible.builtin.debug:
    msg: "Разрешаем HTTP (80) и HTTPS (443) для входящего веб-трафика"
  tags: firewall

- name: ufw allow HTTP
  ansible.builtin.command: ufw allow 80/tcp
  changed_when: false
  tags: firewall

- name: ufw allow HTTPS
  ansible.builtin.command: ufw allow 443/tcp
  changed_when: false
  tags: firewall

- name: "[FIREWALL] Включение ufw"
  ansible.builtin.debug:
    msg:
      - "Включение ufw активирует все правила"
      - "Разрешены: SSH ({{ ssh_port | default(22) }}), HTTP (80), HTTPS (443)"
      - "Всё остальное заблокировано — Zero Trust"
  tags: firewall

- name: ufw enable
  ansible.builtin.command: ufw --force enable
  changed_when: false
  tags: firewall

- name: "[FIREWALL] ====== ИТОГО: Роль firewall завершена ======"
  ansible.builtin.debug:
    msg:
      - "✓ ufw включён"
      - "✓ Incoming: DENY (по умолчанию)"
      - "✓ Outgoing: ALLOW (по умолчанию)"
      - "✓ Разрешены: SSH (порт {{ ssh_port | default(22) }}), HTTP (80), HTTPS (443)"
      - "✓ Концепция Zero Trust реализована"
  tags: firewall