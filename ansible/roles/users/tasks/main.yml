- name: "[USERS] Настройка sudo для admin-user"
  ansible.builtin.debug:
    msg:
      - "Добавляем правило sudoers: admin-user может выполнять любые команды без пароля"
      - "Файл: /etc/sudoers.d/admin-user"
      - "Валидируется через visudo перед сохранением"
  tags: users

- name: Ensure no password-based sudo for admin-user (key-only)
  ansible.builtin.copy:
    dest: /etc/sudoers.d/admin-user
    content: "admin-user ALL=(ALL) NOPASSWD:ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
  tags: users

- name: "[USERS] ====== ИТОГО: Роль users завершена ======"
  ansible.builtin.debug:
    msg:
      - "✓ admin-user создан (группа sudo, ключ: {{ 'установлен' if admin_key_stat.stat.exists else 'НЕ УСТАНОВЛЕН' }})"
      - "✓ deploy-user создан (без sudo, ключ: {{ 'установлен' if deploy_key_stat.stat.exists else 'НЕ УСТАНОВЛЕН' }})"
      - "✓ sudoers настроен для admin-user"
      - "✓ Вход по паролю отключён на уровне SSH — ключи обязательны"
  tags: users
