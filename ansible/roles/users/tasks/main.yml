---
- name: "[USERS] ====== НАЧАЛО: Роль users ======"
  ansible.builtin.debug:
    msg:
      - "Цель: создать admin-user (с sudo) и deploy-user, настроить ключи"
      - "Оба пользователя смогут входить только по SSH-ключу (настроено в ssh-hardening)"
  tags: users

- name: "[USERS] Создание пользователя admin-user"
  ansible.builtin.debug:
    msg:
      - "Создаётся пользователь admin-user"
      - "  • shell: /bin/bash"
      - "  • группы: sudo (будет иметь права администратора)"
      - "  • домашняя директория: /home/admin-user"
  tags: users

- name: Ensure admin-user exists
  ansible.builtin.user:
    name: admin-user
    state: present
    shell: /bin/bash
    groups: sudo
    append: false
    create_home: true
  tags: users

- name: "[USERS] Создание пользователя deploy-user"
  ansible.builtin.debug:
    msg:
      - "Создаётся пользователь deploy-user"
      - "  • shell: /bin/bash"
      - "  • без группы sudo (только деплой)"
      - "  • домашняя директория: /home/deploy-user"
  tags: users

- name: Ensure deploy-user exists
  ansible.builtin.user:
    name: deploy-user
    state: present
    shell: /bin/bash
    create_home: true
  tags: users

- name: "[USERS] Создание ~/.ssh директорий"
  ansible.builtin.debug:
    msg:
      - "Создаются директории /home/admin-user/.ssh и /home/deploy-user/.ssh"
      - "Права: 0700 (только владелец имеет доступ)"
  tags: users

- name: Create .ssh directory for admin-user
  ansible.builtin.file:
    path: /home/admin-user/.ssh
    state: directory
    owner: admin-user
    group: admin-user
    mode: "0700"
  tags: users

- name: Create .ssh directory for deploy-user
  ansible.builtin.file:
    path: /home/deploy-user/.ssh
    state: directory
    owner: deploy-user
    group: deploy-user
    mode: "0700"
  tags: users

- name: "[USERS] Проверка наличия SSH-ключей"
  ansible.builtin.debug:
    msg:
      - "role_path = {{ role_path | default('UNDEFINED') }}"
      - "Проверяем пути:"
      - "  {{ role_path }}/files/admin-key.pub"
      - "  {{ role_path }}/files/deploy-key.pub"
  tags: users

- name: Check if admin-user SSH public key exists
  ansible.builtin.stat:
    path: "{{ role_path }}/files/admin-key.pub"
  register: admin_key_stat
  tags: users

- name: Check if deploy-user SSH public key exists
  ansible.builtin.stat:
    path: "{{ role_path }}/files/deploy-key.pub"
  register: deploy_key_stat
  tags: users

- name: "[USERS] Результат проверки ключей"
  ansible.builtin.debug:
    msg:
      - "admin-key.pub exists: {{ admin_key_stat.stat.exists | default('UNKNOWN') }}"
      - "deploy-key.pub exists: {{ deploy_key_stat.stat.exists | default('UNKNOWN') }}"
  tags: users
  when: admin_key_stat.stat.exists or deploy_key_stat.stat.exists

- name: Install SSH public key for admin-user
  ansible.builtin.authorized_key:
    user: admin-user
    state: present
    key: "{{ lookup('file', role_path + '/files/admin-key.pub') }}"
  when: admin_key_stat.stat.exists
  tags: users

- name: Install SSH public key for deploy-user
  ansible.builtin.authorized_key:
    user: deploy-user
    state: present
    key: "{{ lookup('file', role_path + '/files/deploy-key.pub') }}"
  when: deploy_key_stat.stat.exists
  tags: users

