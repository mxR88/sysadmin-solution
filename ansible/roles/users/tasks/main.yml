---
- name: "[USERS] ====== НАЧАЛО: Роль users ======"
  ansible.builtin.debug:
    msg:
      - "Цель: создать admin-user (с sudo) и deploy-user, установить SSH-ключи"
  tags: users

- name: Ensure admin-user exists
  ansible.builtin.user:
    name: admin-user
    state: present
    shell: /bin/bash
    groups: sudo
    append: false
    create_home: true
  tags: users

- name: Ensure deploy-user exists
  ansible.builtin.user:
    name: deploy-user
    state: present
    shell: /bin/bash
    create_home: true
  tags: users

- name: Create .ssh directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    mode: "0700"
  loop:
    - { path: /home/admin-user/.ssh, owner: admin-user }
    - { path: /home/deploy-user/.ssh, owner: deploy-user }
  tags: users

- name: Install SSH public key for admin-user
  ansible.builtin.authorized_key:
    user: admin-user
    state: present
    key: "{{ lookup('file', role_path + '/files/admin-key.pub') }}"
  tags: users

- name: Install SSH public key for deploy-user
  ansible.builtin.authorized_key:
    user: deploy-user
    state: present
    key: "{{ lookup('file', role_path + '/files/deploy-key.pub') }}"
  tags: users

- name: Configure passwordless sudo for admin-user
  ansible.builtin.copy:
    dest: /etc/sudoers.d/admin-user
    content: "admin-user ALL=(ALL) NOPASSWD:ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
  tags: users

- name: "[USERS] ====== ИТОГО: Роль users завершена ======"
  ansible.builtin.debug:
    msg:
      - "✓ admin-user создан (группа sudo, ключ установлен)"
      - "✓ deploy-user создан (ключ установлен)"
      - "✓ sudoers настроен для admin-user"
  tags: users