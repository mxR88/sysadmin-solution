upstream php_backend {
    # Use container name (internal Docker DNS)
    server apache:80;
    # Alternative: server 172.17.0.1:8080 if using host networking
}

server {
    listen 80;
    listen 443 ssl;
    # server_name localhost;
    server_name _;

    # Self-signed certs
    ssl_certificate /etc/nginx/certs/self-signed.crt;
    ssl_certificate_key /etc/nginx/certs/self-signed.key;

    # Cache static files (images, CSS, JS)
    # location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
    # тут должен быть apache
    location /static {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;  # Reduce log noise for static files
    }

    # Default location
    # location / {
    #     root /usr/share/nginx/html;
    #     index index.html index.htm;
    #     try_files $uri $uri/ /index.html;
    # }

    # Pass PHP files to Apache
    location ~ \.php$ {
        proxy_pass http://php_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Default location - everything else goes to Apache
    location / {
        try_files $uri $uri/ @apache;
    }

    location @apache {
        proxy_pass http://php_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Important: preserve original URI
        proxy_set_header X-Original-URI $request_uri;
        
        # Prevent buffering for SSE/streaming responses
        proxy_buffering off;
    }    

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    # ==== default config commented out
    
    # listen       80;
