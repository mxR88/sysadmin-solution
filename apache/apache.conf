# /etc/apache2/sites-available/000-default.conf
<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html
    
    # Allow only internal network (Docker subnet)
    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require ip 172.0.0.0/8 10.0.0.0/8 192.168.0.0/16
        # Or use container name:
        # Require host nginx_app
    </Directory>
    
    # Enable .htaccess
    <Directory /var/www/html>
        AllowOverride All
    </Directory>
    
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    # json logging ====
    # LogFormat "{ \
    #     \"time\":\"%{%Y-%m-%dT%H:%M:%S%z}t\", \
    #     \"remote_addr\":\"%a\", \
    #     \"remote_user\":\"%u\", \
    #     \"request\":\"%r\", \
    #     \"status\":%>s, \
    #     \"body_bytes_sent\":%B, \
    #     \"request_time\":%D, \
    #     \"http_referrer\":\"%{Referer}i\", \
    #     \"http_user_agent\":\"%{User-Agent}i\" \
    # }" json

    # CustomLog /dev/stdout json
    # ErrorLog /dev/stderr
</VirtualHost>
