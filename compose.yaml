services:

  # ==== база данных и веб-сервер
  postgres:
    image: postgres:18-alpine
    container_name: postgres_app
    restart: unless-stopped
    environment:
      # PRODUCTION: Use secrets or .env file instead of hardcoded values
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: changeme_secure_password_123
      POSTGRES_DB: app_db
    expose:
      - "5432"
    # ports:
      # - "127.0.0.1:5432:5432"  # Listen only on localhost
      # Должно быть доступно только веб-серверу
      # (поэтому можно использовал внутреннюю сеть докера с именами контейнеров вместо доменов)
    volumes:
      - postgres_data:/var/lib/postgresql/18/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d app_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: nginx_app
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./static:/usr/share/nginx/html:ro  # Mount your static files
    # Optional: add healthcheck
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  apache:
    build: ./apache
    container_name: apache_app
    restart: unless-stopped
    expose:
      - "80"  # Internal only, not exposed to host
    volumes:
      - ./app:/var/www/html
      - ./apache/apache.conf:/etc/apache2/sites-available/000-default.conf:ro
      - ./apache/ports.conf:/etc/apache2/ports.conf:ro
    environment:
      # PRODUCTION: Use secrets or .env
      - APACHE_RUN_USER=www-data
      - APACHE_RUN_GROUP=www-data
    depends_on:
      - postgres
    # networks:
      # - app_network
    # Only accept requests from nginx (internal network)
    # Apache listens on port 80 inside container

  # ==== logging

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
    # networks:
      # - app_network

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    # networks:
      # - app_network

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    restart: unless-stopped
    volumes:
      - ./promtail-config.yaml:/etc/promtail/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro # container auto discovery
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      # - ./app/logs:/var/log/app:ro  # Optional: if you mount app logs
    command: -config.file=/etc/promtail/config.yaml
    # networks:
      # - app_network
    
volumes:
  postgres_data:
  loki_data:
  grafana_data:
